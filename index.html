<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Are you ready Chintu Don?</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@500;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fff8ef; --bg2:#ffdfe7; --ink:#6b1d33; --soft:#a5586f; --paper:#fffdf9; --paper-ink:#5a1a2b;
  --red:#a4162d; --rose:#c98b98; --blush:#ffe4ea;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a0e1a; --bg2:#4b1828; --ink:#ffe4ea; --soft:#f2adc0;}}
:root[data-theme="dark"]{--bg1:#2a0e1a; --bg2:#4b1828; --ink:#ffe4ea; --soft:#f2adc0;}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:Nunito,system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
h1,h2{font-family:"Great Vibes","Snell Roundhand",cursive;font-weight:400;margin:0 0 .3em;line-height:1.15;text-align:center;color:var(--red)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h1,:root:not([data-theme="light"]) h2{color:#ff9db5}}
:root[data-theme="dark"] h1,:root[data-theme="dark"] h2{color:#ff9db5}
h1{font-size:clamp(2.9rem,14vw,4.8rem)} h2{font-size:clamp(2.2rem,10vw,3rem)}
h1:focus,h2:focus{outline:none}
p{margin:0}
.serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:1.3rem;line-height:1.5}

/* decor layers */
#hearts,#petals,#corners{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#hearts{z-index:0}#corners{z-index:0}#petals{z-index:45}
#hearts span{position:absolute;bottom:-40px;opacity:0;animation:rise linear forwards}
@keyframes rise{10%{opacity:.7}100%{transform:translateY(-115vh) rotate(25deg);opacity:0}}
.petal{position:absolute;top:0;left:0;width:14px;height:11px;background:radial-gradient(circle at 30% 30%,#ffd0dc,#e88fa8);border-radius:80% 0 80% 0;opacity:.85;animation:fall linear forwards}
@keyframes fall{0%{transform:translate(0,-8vh) rotate(0)}50%{transform:translate(var(--sx),52vh) rotate(calc(var(--r)*.5))}100%{transform:translate(calc(var(--sx)*-.5),112vh) rotate(var(--r))}}
.cr{position:absolute;width:clamp(90px,28vw,160px);height:auto;opacity:.9}
.cr.a{top:-30px;left:-30px}.cr.b{bottom:-34px;right:-34px;rotate:40deg}.cr.c{top:-26px;right:-40px;width:clamp(70px,20vw,110px);rotate:-30deg}.cr.d{bottom:-28px;left:-36px;width:clamp(70px,20vw,110px);rotate:70deg}
.mini{position:absolute;right:-9px;top:-9px;width:28px;height:28px;pointer-events:none;z-index:6}
.p{position:fixed;pointer-events:none;z-index:50;animation:pop 1.3s ease-out forwards;font-size:22px}
@keyframes pop{0%{transform:translate(0,0) scale(.3);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1.1);opacity:0}}
#glow{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity 1.5s;background:radial-gradient(circle at 50% 45%,rgba(255,180,200,.7),transparent 65%)}
#glow.on{opacity:1;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.bigrose{position:fixed;width:56px;z-index:2;pointer-events:none;animation:bloom .9s cubic-bezier(.34,1.56,.64,1) both}
@keyframes bloom{from{scale:0;rotate:-90deg}}
#s3{padding-top:calc(130px + env(safe-area-inset-top,0px));padding-bottom:calc(130px + env(safe-area-inset-bottom,0px))}
#veil{position:fixed;inset:0;z-index:60;background:radial-gradient(circle,#ffe4ea,#f6a9be);display:grid;place-items:center;text-align:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .6s;font-family:"Great Vibes",cursive;font-size:clamp(2.2rem,10vw,3.4rem);color:var(--red)}
#veil.on{opacity:1;pointer-events:auto}

/* screens */
.screen{position:fixed;inset:0;z-index:1;overflow-y:auto;display:flex;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(32px + env(safe-area-inset-bottom,0px));opacity:0;visibility:hidden;transform:translateY(26px) scale(.97);transition:opacity .6s,transform .6s,visibility 0s .6s}
.screen.active{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.wrap{margin:auto;width:100%;max-width:480px;text-align:center;position:relative}
.wrap.wobble{animation:wob 0.5s}
.sub{color:var(--soft);margin-bottom:14px}

/* buttons */
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.slot{display:inline-block}
button{font:inherit;cursor:pointer;border:0}
.btn{position:relative;padding:14px 26px;border-radius:999px;font-weight:700;font-size:1.05rem;min-height:48px;background:#fff;color:var(--red);box-shadow:0 6px 16px rgba(164,22,45,.2);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px)}
.yes{background:var(--red);color:#fff;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(164,22,45,.5)}15%{transform:scale(1.07)}30%{transform:scale(1)}45%{transform:scale(1.05);box-shadow:0 0 22px 8px rgba(242,112,139,.55)}}
.esc{transition:left .45s cubic-bezier(.34,1.56,.64,1),top .45s cubic-bezier(.34,1.56,.64,1);z-index:20;touch-action:none;user-select:none;-webkit-user-select:none}
.shake{animation:wob .5s}
@keyframes wob{20%{translate:-7px 0;rotate:-4deg}40%{translate:7px 0;rotate:4deg}60%{translate:-5px 0;rotate:-2deg}80%{translate:4px 0;rotate:2deg}}
button:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
.bubble{min-height:1.8em;margin-top:14px;font-weight:700;color:var(--red)}
.bubble.pop{animation:in .4s}

/* envelope */
.stage.gone{display:none}
.env{position:relative;display:block;width:min(300px,80vw);aspect-ratio:3/2;margin:26px auto 14px;background:none;padding:0;animation:float 3s ease-in-out infinite}
.env.open{animation:none}
@keyframes float{50%{transform:translateY(-10px)}}
.env>span{position:absolute;display:block}
.e-back{inset:0;background:#f7e6cf;border-radius:8px;box-shadow:0 14px 28px rgba(90,26,43,.25)}
.sheet{inset:10px 16px auto;height:80%;background:#fff;border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.12);transition:transform .8s ease .35s;z-index:1}
.e-front{inset:0;background:#fff3e0;border-radius:8px;clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%);z-index:2}
.flap{inset:0 0 auto 0;height:62%;background:#f3dcc0;border-radius:8px 8px 0 0;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s ease,z-index 0s .35s;z-index:3}
.seal{left:50%;top:50%;translate:-50% -50%;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9304a,#7d0f22);color:#fff;display:grid!important;place-items:center;font-size:1.4rem;z-index:4;transition:opacity .3s}
.env.glowseal .seal{animation:sealglow .5s ease-in-out infinite alternate}
@keyframes sealglow{to{box-shadow:0 0 26px 10px rgba(255,90,122,.85)}}
.env.open .flap{transform:rotateX(180deg);z-index:0}
.env.open .sheet{transform:translateY(-70px)}
.env.open .seal{opacity:0}

/* letter */
.letter{display:none}
.letter.show{display:block;animation:in .8s ease}
@keyframes in{from{opacity:0;transform:translateY(24px)}}
.lc{position:relative;transform-origin:top center;transition:transform .8s,opacity .8s}
.lc.fold{transform:perspective(700px) rotateX(-72deg) scale(.85);opacity:.3}
.paper{background:var(--paper);color:var(--paper-ink);text-align:left;padding:28px 24px;border-radius:6px;box-shadow:0 12px 28px rgba(90,26,43,.22);max-height:min(54vh,440px);overflow-y:auto;font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:1.35rem;line-height:1.55;white-space:pre-line}

/* photos */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px;max-width:440px;margin:18px auto}
.card{position:relative;background:#fff;padding:8px 8px 24px;border-radius:14px;box-shadow:0 8px 20px rgba(90,26,43,.22);transition:transform .25s}
.card:nth-child(1){rotate:-3deg}.card:nth-child(2){rotate:2deg}.card:nth-child(3){rotate:1.5deg}.card:nth-child(4){rotate:-2deg}
.card:hover,.card.show{transform:scale(1.05);rotate:0deg}
.pic{position:relative;aspect-ratio:1/1;border-radius:9px;overflow:hidden;background:linear-gradient(135deg,#e88fa8,#ffc6d3);display:grid;place-items:center;color:#fff;font-size:.8rem}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.msg{white-space:pre-line;overflow:auto;position:absolute;inset:0;display:grid;place-items:center;padding:10px;background:rgba(164,22,45,.82);color:#fff;font-family:"Cormorant Garamond",serif;font-weight:600;font-size:clamp(.85rem,3.7vw,1.05rem);line-height:1.25;opacity:0;transition:opacity .3s}
.card:hover .msg,.card.show .msg,.card:focus-visible .msg{opacity:1}
.hint{font-size:.85rem;color:var(--soft)}

/* modal */
#modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:24px;background:rgba(90,20,40,.4);backdrop-filter:blur(3px);animation:in .3s}
.mc{background:var(--paper);color:var(--paper-ink);border-radius:18px;padding:28px 22px;max-width:360px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:bloom .5s cubic-bezier(.34,1.56,.64,1)}
.mc h3{font-family:"Cormorant Garamond",serif;font-size:1.7rem;margin:0 0 6px;color:var(--red)}
.mc .row{flex-direction:column;align-items:stretch}

/* final */
.yay{display:none}
.yay.show{display:block;animation:in .8s ease}
.emo{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;font-size:2.2rem;margin:20px 0}
.emo span{animation:bounce 1.2s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-14px) scale(1.15)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

    </div>
  </section>

  <section class="screen" id="s1" aria-label="Page 2">
    <div class="wrap">
      <h2 id="t2" tabindex="-1"></h2>
      <div class="stage" id="stage">
        <button class="env" id="env" aria-label="Open the letter" data-rose>
          <span class="e-back"></span><span class="sheet"></span><span class="e-front"></span><span class="flap"></span><span class="seal">♥</span>
        </button>
        <p class="sub" id="h2"></p>
      </div>
      <div class="letter" id="letter">
        <div class="lc" id="lc" data-rose><div class="paper" id="paper" tabindex="0" aria-label="Your letter"></div></div>
        <div class="row">
          <button class="btn yes" id="yes2" data-rose></button>
          <button class="btn" id="no2"></button>
        </div>
      </div>
    </div>
  </section>

  <section class="screen" id="s2" aria-label="Page 3">
    <div class="wrap" id="w3">
      <h1 id="t3" tabindex="-1"></h1>
      <p class="hint" id="h3">Tap a photo to read what's behind it</p>
      <div class="grid" id="grid"></div>
      <p class="serif" id="m3"></p>
      <p class="sub" id="ask" style="margin-top:22px;font-weight:700"></p>
      <div class="row" style="margin-top:8px">
        <button class="btn yes" id="yes3" data-rose></button>
        <button class="btn" id="no3"></button>
      </div>
      <p class="bubble" id="bub3" aria-live="polite"></p>
    </div>
  </section>

  <section class="screen" id="s3" aria-label="Page 4">
    <div class="wrap">
      <div id="ask4">
        <h1 id="t4" tabindex="-1"></h1>
        <p class="serif" id="m4" style="white-space:pre-line;margin-bottom:6px"></p>
        <div class="row">
          <button class="btn yes" id="yes4" data-rose></button>
          <button class="btn" id="no4"></button>
        </div>
        <p class="bubble" id="bub4" aria-live="polite"></p>
        <p class="hint" id="count"></p>
      </div>
      <div class="yay" id="yay">
        <h1 id="yayT" tabindex="-1"></h1>
        <p class="serif" id="yayM"></p>
        <div class="emo" id="emo" aria-hidden="true"></div>
        <button class="btn" id="restart"></button>
      </div>
    </div>
  </section>
</main>

<div id="modal" role="dialog" aria-modal="true" aria-labelledby="mt" hidden>
  <div class="mc" data-rose>
    <h3 id="mt"></h3>
    <div class="row" id="mbtns">
      <button class="btn yes" id="mA"></button>
      <button class="btn" id="mB"></button>
    </div>
  </div>
</div>
<div id="veil" aria-live="polite"></div>

<script>
const $ = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random()*a.length)];
const rnd = (a,b) => a+Math.random()*(b-a);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const K = CONTENT, B = K.buttons, M = K.messages, D = K.decor;
const ROSE = '<svg class="mini" aria-hidden="true"><use href="#rose"/></svg>';

/* ---------- fill content ---------- */
$('q').textContent=K.page1Question; $('t2').textContent=K.page2Title; $('h2').textContent=K.page2Hint;
$('paper').textContent=K.letterContent; $('t3').textContent=K.page3Heading; $('m3').textContent=K.page3Message;
$('ask').textContent=K.page3Ask; $('t4').textContent=K.page4Heading; $('m4').textContent=K.finalApology;
$('yayT').textContent=K.finalCelebration; $('yayM').textContent=K.finalMessage;
$('emo').innerHTML=K.finalEmojis.map((e,i)=>`<span style="animation-delay:${i*.12}s">${e}</span>`).join('');
Object.entries({yes1:B.yes1,no1:B.no1,yes2:B.awww,no2:B.didnt,yes3:B.missToo,no3:B.hell,yes4:B.yes4,no4:B.no4,restart:B.restart,mA:M.reread,mB:M.still})
  .forEach(([id,t])=>$(id).textContent=t);
$('mt').textContent=M.confirm;
[1,2,3,4].forEach(i=>{
  const b=document.createElement('button'); b.className='card'; b.dataset.rose='';
  b.setAttribute('aria-label','Photo '+i+': '+K['photoCaption'+i]);
  b.innerHTML=`<div class="pic"><span>photo${i}</span><img alt="" loading="lazy" decoding="async" src="${K['photo'+i]}"><div class="msg"></div></div>`;
  b.querySelector('.msg').textContent=K['photoCaption'+i];
  b.querySelector('img').onerror=e=>e.target.remove();
  b.onclick=()=>b.classList.toggle('show');
  $('grid').appendChild(b);
});
if(D.cornerRoses) $('corners').innerHTML=['a','b','c','d'].map(c=>`<svg class="cr ${c}"><use href="#rose"/></svg>`).join('');
document.querySelectorAll('[data-rose]').forEach(el=>el.insertAdjacentHTML('beforeend',ROSE));

/* ---------- ambient hearts, sparkles & petals ---------- */
let boost=false;
function petals(n){
  if(reduce) return;
  for(let i=0;i<n;i++){
    const p=document.createElement('span'); p.className='petal';
    p.style.left=rnd(0,100)+'vw'; p.style.scale=rnd(.7,1.5);
    p.style.setProperty('--sx',rnd(-90,90)+'px'); p.style.setProperty('--r',rnd(200,700)+'deg');
    p.style.animationDuration=rnd(4,8)+'s'; p.style.animationDelay=rnd(0,1.2)+'s';
    p.onanimationend=()=>p.remove(); $('petals').appendChild(p);
  }
}
(function loop(){
  if(!reduce){
    const H=$('hearts');
    if(H.children.length<(boost?45:D.hearts)){
      const h=document.createElement('span');
      h.textContent=pick(D.sparkles?['❤️','💕','💗','✨','💖','✨']:['❤️','💕','💗','💖']);
      h.style.left=rnd(0,100)+'vw'; h.style.fontSize=rnd(14,34)+'px'; h.style.animationDuration=rnd(7,13)+'s';
      h.onanimationend=()=>h.remove(); H.appendChild(h);
    }
    if($('petals').children.length<(boost?60:D.petals)) petals(1);
  }
  setTimeout(loop,boost?220:800);
})();

/* ---------- particle burst ---------- */
const HEARTS=['❤️','💖','💕','✨','💗'];
function burst(el,n=16,set=HEARTS){
  const r=el.getBoundingClientRect(), x=r.left+r.width/2, y=r.top+r.height/2, conf=set==='confetti', s=conf?Math.max(innerWidth,600)*.5:170;
  for(let i=0;i<n;i++){
    const p=document.createElement('span'); p.className='p';
    if(conf&&i%3){p.style.cssText+=`width:9px;height:14px;background:${pick(['#a4162d','#f2708b','#ffd9e2','#fff','#ffb3c4'])};border-radius:2px;`}
    else p.textContent=pick(conf?HEARTS:set);
    p.style.left=x+'px'; p.style.top=y+'px';
    p.style.setProperty('--dx',rnd(-s,s)+'px'); p.style.setProperty('--dy',(conf?rnd(-.4,1)*s*1.4:-rnd(30,s))+'px');
    p.style.setProperty('--r',rnd(-360,360)+'deg');
    document.body.appendChild(p); setTimeout(()=>p.remove(),1400);
  }
}
function wobble(el,cls='shake'){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);}
function veil(text,ms,fn){
  const v=$('veil'); v.textContent=text||''; v.classList.add('on');
  setTimeout(()=>{fn();setTimeout(()=>v.classList.remove('on'),300);},ms);
}

/* ---------- page navigation ---------- */
let cur=0;
function go(i){
  $('s'+cur).classList.remove('active'); cur=i;
  const s=$('s'+i); s.classList.add('active'); s.scrollTop=0;
  setTimeout(()=>{const h=s.querySelector('h1,h2'); h&&h.focus({preventScroll:true});},650);
}

/* ---------- PAGE 1: escaping NO ---------- */
function makeEscape(btn){
  const slot=btn.parentElement; let fixed=false;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  function move(e){
    if(e&&e.cancelable) e.preventDefault();
    const r=btn.getBoundingClientRect();
    if(!fixed){
      slot.style.width=r.width+'px'; slot.style.height=r.height+'px';
      btn.style.cssText+=`position:fixed;margin:0;left:${r.left}px;top:${r.top}px;`;
      fixed=true; void btn.offsetWidth;
    }
    const pad=12,w=btn.offsetWidth,h=btn.offsetHeight,cx=parseFloat(btn.style.left),cy=parseFloat(btn.style.top);
    const y=btn.closest('.screen').querySelector('.yes').getBoundingClientRect();
    let nx,ny,t=0;
    do{const a=rnd(0,6.283),d=rnd(110,210);nx=cx+Math.cos(a)*d;ny=cy+Math.sin(a)*d;t++;}
    while(t<30&&(nx<pad||ny<pad||nx>innerWidth-w-pad||ny>innerHeight-h-pad||(nx<y.right+8&&nx+w>y.left-8&&ny<y.bottom+8&&ny+h>y.top-8)));
    btn.style.left=clamp(nx,pad,innerWidth-w-pad)+'px'; btn.style.top=clamp(ny,pad,innerHeight-h-pad)+'px';
    wobble(btn);
  }
  ['pointerenter','pointerdown','touchstart','click','focus'].forEach(t=>btn.addEventListener(t,move,{passive:false}));
  addEventListener('resize',()=>{if(fixed){
    btn.style.left=clamp(parseFloat(btn.style.left),12,innerWidth-btn.offsetWidth-12)+'px';
    btn.style.top=clamp(parseFloat(btn.style.top),12,innerHeight-btn.offsetHeight-12)+'px';}});
  return ()=>{btn.removeAttribute('style');slot.removeAttribute('style');fixed=false;};
}
const resetNo1=makeEscape($('no1'));
$('yes1').onclick=e=>{burst(e.currentTarget);petals(20);setTimeout(()=>go(1),700);};

/* ---------- PAGE 2: envelope + "Didn't like it" popup ---------- */
$('env').onclick=()=>{
  const env=$('env'); env.disabled=true; env.classList.add('glowseal');
  setTimeout(()=>{env.classList.add('open');burst(env,10);petals(14);},700);
  setTimeout(()=>{$('stage').classList.add('gone');$('letter').classList.add('show');},2100);
};
const lc=$('lc');
function openModal(){$('mt').textContent=M.confirm;$('mbtns').hidden=false;$('modal').hidden=false;$('mA').focus();}
function closeModal(){$('modal').hidden=true;lc.classList.remove('fold');}
$('no2').onclick=()=>{
  wobble(lc);
  setTimeout(()=>{lc.classList.add('fold');petals(32);},550);
  setTimeout(openModal,1500);
};
$('mA').onclick=()=>{closeModal();burst(lc,12);};
$('mB').onclick=()=>{
  $('mt').textContent=M.convince; $('mbtns').hidden=true;
  burst($('mt'),16,['✨','💖','🌹','✨','💕']); petals(30);
  setTimeout(()=>{closeModal();burst(lc,10,['✨','💖']);},2400);
};
$('yes2').onclick=e=>{burst(e.currentTarget,22);petals(30);setTimeout(()=>go(2),700);};

/* ---------- PAGE 3: shake-and-react "GO TO HELL" ---------- */
let hellT;
$('no3').onclick=e=>{
  const b=e.currentTarget; wobble(b); wobble($('w3'),'wobble');
  burst(b,8,['😤','💔','😭']);
  const bub=$('bub3'); bub.textContent=M.hellReact; wobble(bub,'pop');
  b.textContent=M.hellTemp; clearTimeout(hellT);
  hellT=setTimeout(()=>{b.textContent=B.hell;bub.textContent='';},1600);
};
$('yes3').onclick=e=>{
  burst(e.currentTarget,30); petals(40); boost=true;
  setTimeout(()=>veil('',700,()=>{go(3);boost=false;}),500);
};

/* ---------- PAGE 4: NO counter + finale ---------- */
let tries=0,noT;
$('no4').onclick=e=>{
  const b=e.currentTarget; tries++;
  wobble(b); petals(14);
  const bub=$('bub4'); bub.textContent=M.noReact; wobble(bub,'pop');
  $('count').textContent=M.attempts+tries+' 😭';
  b.textContent=M.noTemp; clearTimeout(noT);
  noT=setTimeout(()=>{b.textContent=B.no4;bub.textContent='';},1600);
};
const bigRoses=[];
$('yes4').onclick=e=>{
  const b=e.currentTarget; boost=true;
  burst(b,50,'confetti'); burst(b,24); petals(70); $('glow').classList.add('on');
  const n=D.celebrationRoses, per=Math.ceil(n/2);
  for(let i=0;i<n;i++){
    const r=document.createElementNS('http://www.w3.org/2000/svg','svg'); r.setAttribute('class','bigrose');
    r.innerHTML='<use href="#rose"/>';
    const top=i<per, k=top?i:i-per, cnt=top?per:n-per;   // roses sit only in the top and bottom bands, clear of the text
    r.style.left='calc('+((k+.5)/cnt*100)+'% - 28px)';
    if(top) r.style.top='calc(env(safe-area-inset-top,0px) + '+rnd(6,30)+'px)'; else r.style.bottom='calc(env(safe-area-inset-bottom,0px) + '+rnd(6,30)+'px)';
    r.style.rotate=rnd(-35,35)+'deg'; r.style.animationDelay=i*.15+'s';
    document.body.appendChild(r); bigRoses.push(r);
  }
  setTimeout(()=>{$('ask4').style.display='none';$('yay').classList.add('show');$('yayT').focus({preventScroll:true});burst($('yayT'),40,'confetti');petals(40);},650);
};

/* ---------- restart ---------- */
$('restart').onclick=()=>{
  boost=true; petals(80); burst($('restart'),30);
  veil(M.restartVeil,2200,()=>{
    boost=false; tries=0;
    bigRoses.splice(0).forEach(r=>r.remove()); $('glow').classList.remove('on');
    resetNo1();
    const env=$('env'); env.classList.remove('open','glowseal'); env.disabled=false;
    $('stage').classList.remove('gone'); $('letter').classList.remove('show'); lc.classList.remove('fold');
    document.querySelectorAll('.card').forEach(c=>c.classList.remove('show'));
    $('no3').textContent=B.hell; $('no4').textContent=B.no4; $('bub3').textContent=''; $('bub4').textContent=''; $('count').textContent='';
    $('yay').classList.remove('show'); $('ask4').style.display='';
    go(0);
  });
};
</script>
</body>
</html>
